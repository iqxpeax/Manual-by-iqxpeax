<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — Ошибка сервера | Manual by iqxpeax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #090b10;
      --accent: #d4ff4e;
      --accent-glow: rgba(212,255,78,0.22);
      --text-primary: #eef0f8;
      --text-mid: #7a84a0;
      --sidebar-border: #181d2e;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; padding: 40px 24px; }
    .code {
      font-family: 'Syne', sans-serif;
      font-size: 120px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(212,255,78,0.25);
      margin-bottom: 8px;
      user-select: none;
    }
    .code span { color: var(--accent); -webkit-text-stroke: 0; }
    .title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.02em; }
    .desc { font-size: 14px; color: var(--text-mid); line-height: 1.7; font-weight: 300; margin-bottom: 36px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #090b10; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; padding: 12px 28px; border-radius: 20px; box-shadow: 0 0 24px var(--accent-glow); transition: background 0.15s; }
    .btn:hover { background: #e2ff6e; }
    .line { width: 48px; height: 2px; background: var(--sidebar-border); margin: 32px auto; border-radius: 2px; }
    .copy { font-size: 11px; color: var(--text-mid); opacity: 0.5; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">5<span>0</span>0</div>
    <h1 class="title">Внутренняя ошибка</h1>
    <p class="desc">Что-то пошло не так на нашей стороне.<br>Попробуйте обновить страницу или вернуться позже.</p>
    <a href="../index.html" class="btn">← На главную</a>
    <div class="line"></div>
    <p class="copy">© 2025 Manual by iqxpeax — все права защищены</p>
  </div>
</body>
</html>
