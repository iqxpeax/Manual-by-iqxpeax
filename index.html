<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manual by - iqxpeax</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="6" height="6" rx="1.5" fill="#0d0f14"/>
            <rect x="10" y="2" width="6" height="6" rx="1.5" fill="#0d0f14"/>
            <rect x="2" y="10" width="6" height="6" rx="1.5" fill="#0d0f14"/>
            <rect x="10" y="10" width="6" height="6" rx="1.5" fill="#0d0f14" opacity=".4"/>
          </svg>
        </div>
        <span class="logo-text">Manual<span>By - iqxpeax</span></span>
      </div>
    </div>
    <div class="sidebar-section">Программы</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div>
        <div class="progress-label">Прогресс — <span id="progressText">0 / 19</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
    </div>
  </aside>
  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="5" width="16" height="1.8" rx=".9" fill="currentColor"/>
          <rect x="2" y="9.1" width="16" height="1.8" rx=".9" fill="currentColor"/>
          <rect x="2" y="13.2" width="16" height="1.8" rx=".9" fill="currentColor"/>
        </svg>
      </button>
      <div class="breadcrumb">
        <span>Manual</span>
        <span class="breadcrumb-sep">›</span>
        <span id="breadcrumbCurrent">Ознакомление</span>
      </div>
      <div class="topbar-right">
        <span class="chapter-badge" id="chapterBadge">Ch. 01</span>
      </div>
    </div>
    <div class="content-scroll">
      <div id="pagesContainer"></div>
    </div>
  </main>
</div>
<!-- images.js MUST load before general.js -->
<script src="./images.js"></script>
<script src="./main.js"></script>
</body>
</html>
