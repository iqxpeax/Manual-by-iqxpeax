<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — Ошибка сервера | Manual by iqxpeax</title>
  <script>(function(){var t=localStorage.getItem('manual_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#1a1a1a;--text:#e8e8e8;--sub:#666;--accent:#e05252;--border:#2e2e2e;}
    [data-theme="light"]{--bg:#fafafa;--text:#1a1a1a;--sub:#777;--accent:#dc2626;--border:#e0e0e0;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
    .wrap{max-width:420px;padding:40px 24px;}
    .code{font-family:'IBM Plex Mono',monospace;font-size:88px;font-weight:600;color:var(--border);line-height:1;margin-bottom:6px;user-select:none;letter-spacing:-0.04em;}
    .code span{color:var(--accent);}
    .divider{width:32px;height:1px;background:var(--border);margin:20px auto;}
    .title{font-size:18px;font-weight:600;margin-bottom:10px;}
    .desc{font-size:13.5px;color:var(--sub);line-height:1.7;font-weight:300;margin-bottom:32px;}
    .btn{display:inline-flex;align-items:center;gap:6px;background:#4a9eff;color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:0.04em;text-decoration:none;padding:9px 22px;border-radius:3px;transition:opacity .15s;}
    .btn:hover{opacity:.85;}
    .copy{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);margin-top:32px;opacity:.6;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">5<span>0</span>0</div>
    <div class="divider"></div>
    <h1 class="title">Внутренняя ошибка</h1>
    <p class="desc">Что-то пошло не так.<br>Попробуйте обновить страницу или зайти позже.</p>
    <a href="../index.html" class="btn">← на главную</a>
    <p class="copy">© 2025 iqxpeax — все права защищены</p>
  </div>
</body>
</html>
